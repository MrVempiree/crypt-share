      <stop offset="1" stop-color="#050408"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#ff3355" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#e11d48" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3355"/>
      <stop offset="1" stop-color="#7f1d2d"/>
